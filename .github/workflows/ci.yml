name: icon-preview

# Preview-only branch: upload the rendered PNG as a downloadable ZIP; no APK build or release.
on:
  push:
    branches: ["test/icon-preview-20261115"]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Upload icon preview
        uses: actions/upload-artifact@v7
        with:
          name: embermine-icon-sunny-larger
          path: preview/embermine-icon-sunny-larger.png
          if-no-files-found: error
          retention-days: 30
