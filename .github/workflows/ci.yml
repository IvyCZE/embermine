name: ci

# Builds and tests Embermine on every push and pull request. Never publishes anything.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  # Walks the x86_64 APK on an API 34 emulator and uploads screenshots plus reports (screens-index.md,
  # network-hosts.txt, coinstall.txt, logcat-crash.txt). Screens are fail-soft; install and launch failures fail the job.
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant: [light, dark]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: embermine-build
          path: apk

      - name: Enable KVM and install tshark
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y tshark >/dev/null
          ls -la apk

      - name: Run the emulator walk
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -tcpdump /tmp/em.pcap
          script: python3 -m scripts.emulator.run --variant ${{ matrix.variant }} --apk-dir apk --out shots --debug debug

      - name: Network hosts
        if: ${{ !cancelled() }}
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p shots debug
          ls -la /tmp/em.pcap
          python3 -m scripts.emulator.netreport --pcap /tmp/em.pcap --out shots/network-hosts.txt \
            --session "scripted walk of the $VARIANT variant with default settings (onboarding declined, two settings changed: allow screenshots in private browsing, and the toolbar position; neither touches the network), Wi-Fi disabled" \
            --visited debug/visited-urls.txt
          cp /tmp/em.pcap debug/ || true

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          cat shots/screens-index.md >> "$GITHUB_STEP_SUMMARY" || true
          ls -la shots

      - name: Upload screenshots and reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.variant }}
          path: shots
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: emulator-debug-${{ matrix.variant }}
          path: debug
          if-no-files-found: ignore
          retention-days: 7

  # The same APK on Android 11 (API 30), where Material You colours do not exist: homepage, Customize and the
  # wallpaper picker. Uploads the separately named screenshots-legacy set.
  emulator-legacy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: embermine-build
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la apk

      - name: Run the emulator walk
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 -m scripts.emulator.run --variant legacy --apk-dir apk --out shots --debug debug

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          cat shots/screens-index.md >> "$GITHUB_STEP_SUMMARY" || true
          ls -la shots

      - name: Upload screenshots and reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-legacy
          path: shots
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: emulator-debug-legacy
          path: debug
          if-no-files-found: ignore
          retention-days: 7

  # JVM tests of the Embermine Kotlin classes. Runs next to the build, so it prepares its own tree.
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Add 8 GB swap
        run: |
          sudo fallocate -l 8G /swapfile-extra
          sudo chmod 600 /swapfile-extra
          sudo mkswap /swapfile-extra >/dev/null
          sudo swapon /swapfile-extra
          free -m

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/node_modules \
            /usr/share/swift /usr/local/share/powershell /opt/microsoft /opt/google/chrome
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Python script tests
        run: python3 -m unittest discover -s scripts/tests -t . -v

      - name: Resolve Firefox tag, commit and GeckoView build id
        id: res
        run: python3 scripts/resolve-release.py --github-output --cross-check

      - name: Fetch Firefox source (shallow)
        env:
          TAG: ${{ steps.res.outputs.tag }}
          SHA: ${{ steps.res.outputs.sha }}
        run: bash scripts/fetch-source.sh "$TAG" "$SHA" fx

      - name: Apply patches
        run: bash scripts/apply-patches.sh fx

      - name: Run generators
        run: bash scripts/run-generators.sh fx

      - name: Restore ~/.mozbuild
        uses: actions/cache/restore@v6
        with:
          path: ~/.mozbuild
          key: mozbuild-${{ runner.os }}-${{ steps.res.outputs.version }}-v1
          restore-keys: mozbuild-${{ runner.os }}-

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Configure (no-compile) and export
        env:
          BUILDID: ${{ steps.res.outputs.buildid }}
        run: bash scripts/configure-tree.sh fx "$BUILDID"

      - name: Gradle unit tests (org.mozilla.fenix.embermine)
        working-directory: fx/mobile/android/fenix
        run: |
          set -euo pipefail
          free -m
          # If memory runs out, the OOM killer must hit Gradle, not the runner agent.
          echo 1000 | sudo tee "/proc/$$/oom_score_adj" >/dev/null
          ./gradlew --no-daemon --max-workers=3 \
            -Dorg.gradle.jvmargs="-Xmx6g -Xms1g -XX:MaxMetaspaceSize=1536m -XX:+UseParallelGC" \
            -Pkotlin.daemon.jvmargs=-Xmx3g \
            --continue \
            :app:testDebugUnitTest --tests "org.mozilla.fenix.embermine.*" \
            -PdisableDebugSigning

      # A green Gradle run proves nothing when the test filter matched no class.
      - name: Check that the tests really ran
        if: ${{ !cancelled() }}
        run: |
          mkdir -p unit-test-results
          find fx/obj-embermine/gradle/build/mobile/android/fenix -name 'TEST-*.xml' -path '*test-results*' \
            -exec cp --parents {} unit-test-results/ \;
          python3 scripts/junit_summary.py unit-test-results \
            --require-class org.mozilla.fenix.embermine.EmbermineVersionTest

      - name: Upload unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: unit-test-results
          if-no-files-found: warn
          retention-days: 30
